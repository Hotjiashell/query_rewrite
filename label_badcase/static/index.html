<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>案例检索 · 人工核验台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div><span class="eyebrow">RETRIEVAL REVIEW</span><h1>案例检索 · 人工核验台</h1></div><div class="toolbar"><span id="save-state" role="status">正在加载</span><button id="retry" hidden>重试保存</button><button id="owners-open">负责人设置</button><button id="types-open">管理错误类型</button><button id="export">导出标注</button></div></header>
<div id="default-owner-status" class="muted" style="padding:8px 32px 0;font-size:12px">我的默认负责人：未设置</div>
<section id="stats" class="stats" aria-label="实时统计"></section>
<section id="human-review-chart" class="summary-chart" aria-label="人工核验结果数量"></section>
<div id="sync-state" style="padding:0 32px;color:#647681;font-size:12px" role="status">自动同步 · 每 3 秒</div>
<section class="workbar"><div class="toolbar"><label>筛选 <select id="filter"><option value="all">全部 badcase</option><option value="pending">待完成</option><option value="complete">已完成</option><option value="alternative">人工确认有其他正确案例</option><option value="genuine">真实 badcase</option><option value="uncertain">待进一步确认（不确定）</option><option value="model">模型认为有其他正确案例</option><option value="model_none">模型认为没有其他正确案例</option></select></label><label>人工核验 <select id="human-review-filter" title="按已保存的人工判断筛选；有正确案例和有不确定可同时命中"><option value="">全部人工核验结果</option><option value="yes">人认为有正确案例</option><option value="no">人认为没有正确案例（已完成）</option><option value="uncertain">人认为有不确定的案例</option><option value="unreviewed">尚未人工判断</option></select></label><label>错误类型 <select id="error-type-filter"><option value="">全部错误类型</option><option value="unset">未分类</option></select></label><input id="search" type="search" placeholder="搜索对话 / 标题 / ID" aria-label="搜索badcase"></div><div class="toolbar"><span id="page-info"></span><label>跳至 <input id="jump" type="number" min="1" aria-label="跳至页码"></label><button id="jump-go">前往</button></div></section>
<div id="notice" class="notice" role="alert" hidden></div>
<section id="conflict" class="notice" hidden><strong>当前 badcase 有其他人的更新，你的草稿已保留。</strong><p>请先查看最新标注，再决定采用哪一份；继续编辑不会覆盖他人的结果。</p><details><summary>查看服务端最新标注</summary><pre id="remote-annotation" class="content"></pre></details><div class="toolbar"><button id="use-remote">采用最新标注</button><button id="use-draft">保留我的草稿并提交</button><button id="download-draft">下载我的草稿</button></div></section>
<main id="workspace"></main>
<footer><div id="record-state"></div><div class="toolbar"><button id="prev">← 上一条</button><button id="next">下一条 →</button><button id="next-pending" title="在当前筛选和搜索范围内查找，末尾自动从头继续">下一个未完成 ⇥</button><button class="primary" id="complete">完成标注</button></div></footer>
<dialog id="types-dialog"><div class="dialog-head"><h2>错误类型</h2><button id="types-close" aria-label="关闭">✕</button></div><p class="muted">删除类型后，已有标注归入“其他”，原类型会保留在详细说明中。</p><div id="types-list"></div><form id="type-form"><input id="type-name" placeholder="新的错误类型" maxlength="80" required><button class="primary">添加类型</button></form></dialog>
<dialog id="owners-dialog"><div class="dialog-head"><h2>负责人名单</h2><button id="owners-close" aria-label="关闭负责人管理">✕</button></div><p class="muted">添加一次姓名，即可在核验负责人和分类负责人下拉框中选择。名单自动保存并同步给所有标注者。</p><label class="form-field"><span>我的默认负责人（仅当前浏览器）</span><select id="default-owner"><option value="">不设置默认负责人</option></select></label><p class="muted">新标注自动使用该姓名，已有负责人保持原值；单条记录仍可手动选择其他姓名。仅浏览记录不会自动写入负责人。</p><div id="owners-list"></div><form id="owner-form" class="toolbar"><input id="owner-name" placeholder="姓名" maxlength="80" required><button class="primary">添加负责人</button></form><p id="owners-message" role="status" class="muted"></p></dialog>
<script src="/app.js"></script>
</body></html>

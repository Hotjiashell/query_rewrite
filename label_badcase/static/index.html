<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>案例检索 · 人工核验台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div><span class="eyebrow">RETRIEVAL REVIEW</span><h1>案例检索 · 人工核验台</h1></div><div class="toolbar"><span id="save-state" role="status">正在加载</span><button id="retry" hidden>重试保存</button><button id="types-open">管理错误类型</button><button id="export">导出标注</button></div></header>
<section id="stats" class="stats" aria-label="实时统计"></section>
<div id="sync-state" style="padding:0 32px;color:#647681;font-size:12px" role="status">自动同步 · 每 3 秒</div>
<section class="workbar"><div class="toolbar"><label>筛选 <select id="filter"><option value="all">全部 badcase</option><option value="pending">待完成</option><option value="complete">已完成</option><option value="alternative">人工确认有其他正确案例</option><option value="genuine">真实 badcase</option><option value="model">模型认为有其他正确案例</option><option value="model_none">模型认为没有其他正确案例</option></select></label><input id="search" type="search" placeholder="搜索对话 / 标题 / ID" aria-label="搜索badcase"></div><div class="toolbar"><span id="page-info"></span><label>跳至 <input id="jump" type="number" min="1" aria-label="跳至页码"></label><button id="jump-go">前往</button></div></section>
<div id="notice" class="notice" role="alert" hidden></div>
<section id="conflict" class="notice" hidden><strong>当前 badcase 有其他人的更新，你的草稿已保留。</strong><p>请先查看最新标注，再决定采用哪一份；继续编辑不会覆盖他人的结果。</p><details><summary>查看服务端最新标注</summary><pre id="remote-annotation" class="content"></pre></details><div class="toolbar"><button id="use-remote">采用最新标注</button><button id="use-draft">保留我的草稿并提交</button><button id="download-draft">下载我的草稿</button></div></section>
<main id="workspace"></main>
<footer><div id="record-state"></div><div class="toolbar"><button id="prev">← 上一条</button><button id="next">下一条 →</button><button class="primary" id="complete">完成标注</button></div></footer>
<dialog id="types-dialog"><div class="dialog-head"><h2>错误类型</h2><button id="types-close" aria-label="关闭">✕</button></div><p class="muted">删除类型后，已有标注归入“其他”，原类型会保留在详细说明中。</p><div id="types-list"></div><form id="type-form"><input id="type-name" placeholder="新的错误类型" maxlength="80" required><button class="primary">添加类型</button></form></dialog>
<script src="/app.js"></script>
</body></html>

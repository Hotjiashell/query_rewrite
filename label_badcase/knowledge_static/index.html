<!doctype html><html lang="zh"><meta charset="utf-8"><title>知识解决能力标注</title><style>body{font:15px system-ui;background:#f3f5f9;color:#243147;margin:24px}header,section{background:white;padding:20px;border-radius:12px;margin-bottom:16px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}textarea,input,select,button{font:inherit;padding:9px;border:1px solid #bfcbdc;border-radius:6px;box-sizing:border-box}textarea{width:100%;min-height:120px}button{cursor:pointer;background:#eaf0ff;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}#status{color:#125ba4}details{padding:10px;border-bottom:1px solid #ddd}@media(max-width:900px){main{display:block}}</style>
<header><h1>Badcase · 知识解决能力标注</h1><p id="stats"></p><select id="filter"><option value="all">全部</option><option value="pending">未标注</option><option value="yes">能通过知识解决</option><option value="no">不能通过知识解决</option></select> <input id="search" placeholder="搜索对话、query、GT"><button id="prev">上一条</button><button id="next">下一条</button><span id="position"></span><a href="/api/export" download="knowledge_annotations.json">导出标注 JSON</a><p id="status" role="status"></p></header>
<main><section><h2 id="recordTitle"></h2><h3>对话</h3><pre id="dialogue"></pre><h3>原 query</h3><pre id="original"></pre><h3>GT 案例</h3><div id="gt"></div><h3>原召回案例</h3><div id="retrieved"></div></section><div><section><h2>人工标注</h2><label>能否通过知识解决（必选）<select id="decision"><option value="">请选择</option><option value="yes">能</option><option value="no">不能</option></select></label><div id="yesFields"><label>知识条目（选填）<textarea id="entry"></textarea></label><button id="useEntry">追加到测试知识</button></div><div id="noFields"><label>错误类型（选填）<input id="errorType" list="types"><datalist id="types"></datalist></label><label>原因（选填）<textarea id="reason"></textarea></label></div><button id="save">保存标注</button><button id="saveNext">保存并下一条未标注</button><p>选择判断后点击保存。翻页前会保存已有判断；未选择判断不能保存。</p></section><section><h2>生成 query 并检索</h2><label>基础提示词模板<textarea id="prompt"></textarea></label><p>支持 {knowledge} 和 {dialogue}；没有对话占位符时会自动追加当前对话。</p><label>测试知识条目<textarea id="knowledge"></textarea></label><button id="saveSettings">保存提示词与知识</button><button id="generate">生成 query 并检索</button><label>手动检索 query<input id="query" style="width:100%"></label><button id="retrieve">检索</button><div id="results"></div></section></div></main><script src="/app.js"></script></html>

<!doctype html><html lang="zh"><meta charset="utf-8"><title>知识解决能力标注</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{color-scheme:light;--ink:#21334b;--muted:#758299;--line:#e3e9f1;--blue:#4361df;--soft:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:28px 36px 48px;background:#f3f6fb;color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{max-width:1700px;margin:0 auto 24px;padding:0}h1{font-size:26px;letter-spacing:-.7px;margin:0;font-weight:750}h1:before{content:"K";display:inline-grid;place-items:center;width:38px;height:38px;margin-right:12px;border-radius:11px;background:var(--blue);color:white;font-size:22px;box-shadow:0 5px 12px #4361df25}#stats{margin:12px 0 20px 52px;color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;background:white;border:1px solid var(--line);padding:14px 18px;border-radius:14px;box-shadow:0 3px 12px #21334b03}.toolbar #search{flex:1;min-width:180px}.toolbar #filter{min-width:160px}.toolbar a{margin-left:auto;color:var(--blue);text-decoration:none;font-size:13px;padding:6px}#position{font-size:12px;color:var(--muted);margin:0 4px}#status{margin:10px 4px 0;color:var(--blue);font-size:13px;min-height:22px}main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;gap:24px;max-width:1700px;margin:auto}main>div{min-width:0}section{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:22px;box-shadow:0 5px 20px #24314704;min-width:0}h2{font-size:18px;margin:0 0 22px;display:flex;align-items:center;gap:10px}h2:before{content:"";width:4px;height:18px;background:var(--blue);border-radius:3px}h3{font-size:12px;color:var(--muted);font-weight:650;margin:25px 0 10px;letter-spacing:.5px}pre{font:13px/1.85 "SFMono-Regular",Consolas,"PingFang SC",monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}#dialogue{background:var(--soft);border:1px solid #edf0f6;border-radius:10px;padding:20px;max-height:520px;overflow:auto}#original{padding:13px 16px;border-left:3px solid #c0ccfb;background:#f6f8ff;border-radius:0 8px 8px 0;color:#4c5d84}input,select,textarea,button{font:inherit;transition:border-color .15s,box-shadow .15s,background .15s}input,select,textarea{border:1px solid #dce3ee;border-radius:8px;padding:9px 12px;background:white;color:var(--ink);max-width:100%}input::placeholder,textarea::placeholder{color:#a2adbe}input:focus,select:focus,textarea:focus{outline:none;border-color:#8a9cf0;box-shadow:0 0 0 3px #4361df12}textarea{display:block;width:100%;min-height:130px;resize:vertical;line-height:1.7;margin-top:8px}#prompt,#knowledge{font-family:"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:13px;background:#fafbfe;min-height:180px}label{display:block;color:#52627a;font-size:13px;font-weight:600;margin:18px 0 12px}label select,label input{display:block;margin-top:8px;width:100%;font-weight:400}#decision{font-weight:600;background:#f8faff;padding:12px}button{border:1px solid #dce3ee;border-radius:8px;background:white;color:#4b5c76;padding:9px 14px;cursor:pointer;white-space:normal;line-height:1.5}button:hover{background:#f4f6fc;border-color:#aab9e1}button:focus-visible,a:focus-visible{outline:3px solid #afbcfa;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}#saveNext,#generate{background:var(--blue);border-color:var(--blue);color:white;box-shadow:0 3px 7px #4361df16}#saveNext:hover,#generate:hover{background:#354fc5}#save{color:var(--blue);background:#eef2ff;border-color:#e0e6ff}#useEntry{font-size:12px;padding:6px 10px;color:#526bc7}section>button{margin:5px 5px 0 0}section>p{font-size:12px;color:var(--muted);line-height:1.8}details{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}summary{cursor:pointer;line-height:1.7;padding:12px 14px;font-size:13px;background:#fcfdff;overflow-wrap:anywhere}summary:hover{background:#f4f7fd}details[open] summary{border-bottom:1px solid var(--line);color:var(--blue)}details pre{padding:15px;color:#59697e;background:white}#results:not(:empty){margin-top:22px;padding-top:4px;border-top:1px solid var(--line)}#yesFields{padding:0 14px 14px;border-radius:10px;background:#f4faf8;border:1px solid #e1eee8}#noFields{padding:0 14px 14px;border-radius:10px;background:#fffbf6;border:1px solid #f1e9de}[hidden]{display:none!important}@media(min-width:1500px){body{padding-left:4vw;padding-right:4vw}}@media(max-width:1000px){body{padding:20px}main{grid-template-columns:1fr}.toolbar #search{min-width:140px}section{padding:22px}}@media(max-width:550px){body{padding:14px}h1{font-size:20px}#stats{margin-left:0}.toolbar{padding:12px;gap:7px}.toolbar #filter,.toolbar #search{width:100%;flex-basis:100%}.toolbar a{margin-left:0}section{padding:18px;border-radius:12px}#saveNext{width:100%;margin-top:10px}}

.gt-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:13px 15px;margin:12px 0;border:1px solid #76c7a3;border-left:5px solid #159367;background:#e9f8f0;border-radius:9px;color:#126b4a}.gt-banner strong{font-size:14px}.gt-banner span{font-size:12px}.gt-hit{border:2px solid #35a777;box-shadow:0 0 0 3px #35a77712}.gt-hit summary,.gt-hit[open] summary{background:#edf9f2;color:#126b4a;font-weight:700}.gt-hit summary:hover{background:#dff3e8}.gt-miss{padding:10px 14px;margin:12px 0;border:1px solid #efd6ab;border-radius:8px;background:#fff8eb;color:#98651b;font-size:13px}
</style>
<header><h1>Badcase · 知识解决能力标注</h1><p id="stats"></p><div class="toolbar"><select id="filter"><option value="all">全部</option><option value="pending">未标注</option><option value="yes">能通过知识解决</option><option value="no">不能通过知识解决</option></select> <input id="search" placeholder="搜索对话、query、GT"><button id="prev">上一条</button><button id="next">下一条</button><span id="position"></span> <input id="pageNumber" type="number" min="1" step="1" aria-label="跳转页码" style="width:90px"><button id="jump">跳转</button><a href="/api/export" download="knowledge_annotations.json">导出标注 JSON</a></div><p id="status" role="status"></p><div class="toolbar"><span id="syncStatus">自动同步 · 每 3 秒</span><button id="syncNow">立即同步</button><label style="margin:0">我的标注姓名 <input id="owner" placeholder="填写姓名（选填）" style="display:inline;width:150px"></label></div><div id="conflicts" hidden class="gt-miss"><strong>检测到其他人的修改，当前输入已保留</strong><pre id="remoteChanges"></pre><button id="acceptRemote">采用最新标注</button><button id="keepLocal">保留我的标注并保存</button><button id="acceptSettings">采用最新提示词与知识</button><button id="keepSettings">保留我的提示词与知识并保存</button></div></header>
<main><section><h2 id="recordTitle"></h2><h3>对话</h3><pre id="dialogue"></pre><h3>原 query</h3><pre id="original"></pre><h3>GT 案例</h3><div id="gt"></div><h3>原召回案例</h3><div id="retrieved"></div></section><div><section><h2>知识解决能力判断</h2><label>能否通过知识解决（必选）<select id="decision"><option value="">请选择</option><option value="yes">能</option><option value="no">不能</option></select></label><div id="yesFields"><label>知识条目（选填）<textarea id="entry" placeholder="记录能够帮助解决这条 badcase 的知识…"></textarea></label><button id="useEntry">追加到测试知识</button></div><div id="noFields"><label>错误类型（选填）<input id="errorType" list="types"><datalist id="types"></datalist></label><label>原因（选填）<textarea id="reason" placeholder="描述无法通过知识解决的原因…"></textarea></label></div><button id="save">保存标注</button><button id="saveNext">保存并跳转到下一条未标注</button><p>选择判断后点击保存。翻页前会保存已有判断；未选择判断不能保存。</p></section><section><h2>Query 生成与检索验证</h2><label>基础提示词模板<textarea id="prompt"></textarea></label><p>支持 {knowledge} 和 {dialogue}；没有对话占位符时会自动追加当前对话。</p><label>测试知识条目<textarea id="knowledge"></textarea></label><button id="saveSettings">保存提示词与知识</button><button id="generate">生成 query 并检索</button><label>手动检索 query<input id="query" style="width:100%"></label><button id="retrieve">检索</button><div id="results"></div></section></div></main><script src="/app.js"></script></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识标注工作台</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#21332f;background:#f1f5f2;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #cad8d0;border-radius:8px;background:white;color:#26483c;padding:9px 14px}button:hover{background:#edf5ee}button:disabled{opacity:.45;cursor:default}.primary{background:#216449;color:white;border-color:#216449}.primary:hover{background:#194e39}textarea{width:100%;resize:vertical;border:1px solid #cbd8cf;border-radius:8px;padding:12px;line-height:1.7;color:#233d33;background:#fff}textarea:focus,input:focus{outline:2px solid #a7cbb8}header{background:#173e30;color:white;padding:20px 28px;display:flex;align-items:center;gap:20px;justify-content:space-between}h1{font-size:21px;margin:0 0 7px}header small{color:#bcd1c5;word-break:break-all}.top-actions{display:flex;align-items:center;gap:16px;flex-shrink:0}#save-status{font-size:12px;color:#d9e8df}main{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px;padding:24px;max-width:1600px;margin:auto}aside{background:#fff;border:1px solid #d9e2db;border-radius:12px;padding:20px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 140px);overflow:auto}h2{font-size:17px;margin:0 0 14px}.muted{color:#74837b;font-size:12px;line-height:1.7}.confirmed{border-top:1px solid #e7ece8;padding-top:14px;margin-top:14px}.confirmed textarea{min-height:95px;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.text-button{border:0;padding:5px;color:#8d514c;font-size:12px}.card{background:white;border:1px solid #d9e2db;border-radius:12px;padding:24px;margin-bottom:18px}.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav input{width:64px;padding:7px;border-radius:6px;border:1px solid #cad8d0}#keyword{font-size:25px;margin:12px 0}.badge{display:inline-block;padding:4px 9px;border-radius:5px;background:#e7f2eb;font-size:12px;margin-right:6px;color:#3b6952}.label{font-size:12px;color:#637a6c;margin:20px 0 9px;font-weight:600}#draft{min-height:140px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}pre{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.8;margin:8px 0}.source{border:1px solid #e0e8e2;border-radius:9px;margin-top:12px;padding:16px}.source h3{font-size:15px;margin:0 0 8px}.source details{margin-top:14px}.source summary{cursor:pointer;color:#3b6d51}.source .query{background:#f3f7f4;padding:10px;border-radius:6px}.reason{line-height:1.8;white-space:pre-wrap;color:#5b7064}#notice{position:fixed;bottom:22px;right:24px;max-width:650px;white-space:pre-wrap;background:#173e30;color:white;border-radius:10px;padding:15px 22px;box-shadow:0 5px 30px #0002;display:none}#notice.error{background:#8d3631}#empty{display:none}.model-original{background:#f5f7f5;padding:12px;border-radius:6px}.progress{height:4px;background:#dce8df;margin-top:12px;border-radius:3px;overflow:hidden}.progress span{display:block;height:100%;background:#45966b}#search{width:100%;padding:8px;border:1px solid #d1dcd4;border-radius:6px;margin-top:10px}@media(max-width:900px){main{grid-template-columns:1fr}aside{position:static;max-height:450px}header{align-items:flex-start;flex-direction:column}.card{padding:18px}}
</style></head><body>
<header><div><h1>知识标注工作台</h1><small id="run-dir">正在读取 run 目录…</small></div><div class="top-actions"><span id="save-status" role="status">加载中</span><button id="export">导出确定知识</button></div></header>
<main><aside><div class="row"><h2>确定知识 <span id="confirmed-count"></span></h2><button id="new-entry">＋ 新增</button></div><div class="muted">已有知识作为初始内容。可直接编辑；修改会自动保存。</div><input id="search" placeholder="搜索确定知识" aria-label="搜索确定知识"><div id="confirmed-list"></div></aside>
<section><div class="nav"><button id="prev">← 上一条</button><span id="page-count"></span><button id="next">下一条 →</button><label>跳转 <input id="jump" type="number" min="1" aria-label="跳转页码"></label><button id="jump-button">前往</button><button id="next-pending">下一条未处理</button></div><div class="muted" id="review-progress"></div><div class="progress"><span id="progress-bar"></span></div>
<div id="empty" class="card">本次 run 没有模型知识条目。你仍可编辑左侧已有知识并导出。</div>
<div id="review"><article class="card"><div><span class="badge" id="status"></span><span class="muted" id="counts"></span></div><h2 id="keyword"></h2><div class="muted" id="aliases"></div><div class="label">抽取依据</div><div class="reason" id="reason"></div><details style="margin-top:16px"><summary>查看模型原始知识</summary><pre id="original" class="model-original"></pre></details><div class="label">待加入的知识 · 可修改</div><textarea id="draft" aria-label="待加入的知识"></textarea><div class="actions"><button class="primary" id="add">加入确定知识</button><button id="skip">暂不加入</button><button id="reset">恢复模型原文</button></div><div class="muted" style="margin-top:10px">加入后可继续在左侧修改。每个模型条目只加入一次，再次操作会更新对应条目。</div></article>
<article class="card"><div class="row"><h2>来源案例与对话</h2><span class="muted" id="source-count"></span></div><div class="muted">展示该聚类的来源对话；标有“模型抽取样本”的记录参与了最终知识总结。</div><div id="sources"></div></article></div></section></main><div id="notice" role="alert"></div>
<script>
let state,candidates=[],active=0,timer,saveQueue=Promise.resolve(),dirty=false;
const $=id=>document.getElementById(id);
let localIdSequence=0;
function newEntryId(){
 const api=globalThis.crypto;
 let id;
 do{
  if(api&&typeof api.randomUUID==='function')id=api.randomUUID();
  else if(api&&typeof api.getRandomValues==='function')id='entry-'+Array.from(api.getRandomValues(new Uint32Array(4)),n=>n.toString(16).padStart(8,'0')).join('');
  else id='entry-'+Date.now().toString(36)+'-'+(++localIdSequence).toString(36)+'-'+Math.random().toString(36).slice(2);
 }while(state.confirmed.some(item=>item.id===id));
 return id;
}
function el(tag,cls,value){const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node}
function toast(message,error=false){$('notice').textContent=message;$('notice').className=error?'error':'';$('notice').style.display='block';if(!error)setTimeout(()=>$('notice').style.display='none',5000)}
function changed(){dirty=true;$('save-status').textContent='待保存…';clearTimeout(timer);timer=setTimeout(()=>persist(),650)}
function persist(exporting=false){clearTimeout(timer);saveQueue=saveQueue.catch(()=>{}).then(async()=>{const snapshot=JSON.parse(JSON.stringify(state));$('save-status').textContent='正在保存…';const response=await fetch(exporting?'/api/export':'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');state.revision=result.revision;dirty=JSON.stringify({...state,revision:snapshot.revision})!==JSON.stringify(snapshot);$('save-status').textContent=dirty?'待保存…':'已保存';if(exporting)toast('已导出 '+snapshot.confirmed.length+' 条确定知识：\n'+result.paths.join('\n'));});saveQueue.catch(error=>{dirty=true;$('save-status').textContent='保存失败，点击重试';toast(error.message,true)});return saveQueue}
function renderConfirmed(){const container=$('confirmed-list');container.replaceChildren();$('confirmed-count').textContent='('+state.confirmed.length+')';const query=$('search').value.trim().toLowerCase();for(const [i,item] of state.confirmed.entries()){if(query&&!item.text.toLowerCase().includes(query))continue;const box=el('div','confirmed'),row=el('div','row');row.append(el('span','muted',(i+1)+'. '+(item.source==='existing'?'初始知识':'人工确定')));const remove=el('button','text-button','移除');remove.onclick=()=>{state.confirmed=state.confirmed.filter(r=>r.id!==item.id);if(item.candidate!==undefined)delete state.statuses[item.candidate];changed();renderConfirmed();renderMeta()};row.append(remove);const field=el('textarea');field.value=item.text;field.setAttribute('aria-label','确定知识 '+(i+1));field.oninput=()=>{item.text=field.value;changed()};field.onblur=()=>{if(!item.text.trim()){toast('知识内容不能为空；不需要时请点击移除。',true)}};box.append(row,field);container.append(box)}}
function renderMeta(){const done=Object.keys(state.statuses).length;$('review-progress').textContent=`已处理 ${done} / ${candidates.length} 条 · 已加入 ${Object.values(state.statuses).filter(s=>s==='added').length} 条`;$('progress-bar').style.width=(candidates.length?done/candidates.length*100:0)+'%';if(candidates.length)$('status').textContent=({added:'已加入',skipped:'暂不加入'})[state.statuses[String(active)]]||'待审核'}
function render(){renderMeta();$('page-count').textContent=candidates.length?`${active+1} / ${candidates.length}`:'0 / 0';$('jump').value=candidates.length?active+1:'';$('jump').max=candidates.length;$('prev').disabled=active===0;$('next').disabled=active>=candidates.length-1;$('review').style.display=candidates.length?'block':'none';$('empty').style.display=candidates.length?'none':'block';if(!candidates.length)return;const item=candidates[active];$('keyword').textContent=item.keyword||'未命名关键词';$('aliases').textContent=[item.desc?'描述解释：'+item.desc:'',(item.concepts||[]).length?'词条：'+item.concepts.join(' / '):((item.aliases||[]).length?'相关写法：'+item.aliases.join(' / '):'')].filter(Boolean).join('；');$('counts').textContent=`${item.cluster_count??item.records.length} 条对话 · ${item.gt_case_count??'—'} 个 GT 案例`;$('reason').textContent=item.reason||'未提供依据';$('original').textContent=item.knowledge;$('draft').value=state.drafts[String(active)]??item.knowledge;const joined=state.confirmed.some(r=>r.candidate===String(active));$('add').textContent=joined?'更新确定知识':'加入确定知识';$('source-count').textContent=item.records.length+' 条';const container=$('sources');container.replaceChildren();if(!item.records.length)container.append(el('p','muted','未找到来源聚类文件，请检查 run 目录中的 06_retained_clusters.json 等过程文件。'));const sampled=new Set(item.example_ids||[]);for(const [i,row] of item.records.entries()){const box=el('div','source');box.append(el('h3','',`${i+1}. ${row.gt_case_title||'无标题'}`));if(sampled.has(row.id))box.append(el('span','badge','模型抽取样本'));box.append(el('span','muted','案例 ID：'+(row.expected_case_id||'—')));box.append(el('div','label','原始 query'));box.append(el('pre','query',(row.queries||[]).join('\n')||'未提供'));if(row.gt_case_content){const content=el('details');content.append(el('summary','','案例正文'),el('pre','',row.gt_case_content));box.append(content)}const details=el('details');details.open=i===0;details.append(el('summary','','完整对话'),el('pre','',row.chat_content||'未提供'));box.append(details);container.append(box)}}
function go(index){if(index<0||index>=candidates.length)return;active=index;state.index=index;changed();render();window.scrollTo({top:0,behavior:'smooth'})}
$('draft').oninput=()=>{state.drafts[String(active)]=$('draft').value;changed()};$('prev').onclick=()=>go(active-1);$('next').onclick=()=>go(active+1);$('jump-button').onclick=()=>go(Number($('jump').value)-1);$('jump').onkeydown=e=>{if(e.key==='Enter')go(Number(e.target.value)-1)};
$('next-pending').onclick=()=>{for(let step=1;step<=candidates.length;step++){const i=(active+step)%candidates.length;if(!state.statuses[String(i)])return go(i)}toast('所有模型条目都已处理')};
$('add').onclick=()=>{const value=$('draft').value.trim();if(!value)return toast('请填写待加入知识',true);const key=String(active);let item=state.confirmed.find(r=>r.candidate===key);if(item)item.text=value;else state.confirmed.push({id:newEntryId(),text:value,source:'model',candidate:key});state.statuses[key]='added';state.drafts[key]=value;changed();renderConfirmed();render();persist().catch(()=>{});toast(item?'已更新对应的确定知识':'已加入确定知识')};
$('skip').onclick=()=>{if(state.confirmed.some(r=>r.candidate===String(active)))return toast('此条已加入，若不需要请先在左侧移除');state.statuses[String(active)]='skipped';changed();renderMeta()};
$('reset').onclick=()=>{state.drafts[String(active)]=candidates[active].knowledge;changed();render()};
$('new-entry').onclick=()=>{state.confirmed.push({id:newEntryId(),text:'请填写新知识条目',source:'manual'});changed();$('search').value='';renderConfirmed();const fields=$('confirmed-list').querySelectorAll('textarea');fields[fields.length-1].focus();fields[fields.length-1].select()};
$('search').oninput=renderConfirmed;$('export').onclick=()=>persist(true).catch(()=>{});$('save-status').onclick=()=>persist().catch(()=>{});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
fetch('/api/data').then(async response=>{if(!response.ok)throw Error('无法加载标注数据');return response.json()}).then(data=>{state=data.state;candidates=data.candidates;active=state.index;$('run-dir').textContent=data.run_dir;$('save-status').textContent='已保存';renderConfirmed();render()}).catch(error=>toast(error.message,true));
</script></body></html>
